<div class="flex min-h-[70vh] items-center justify-center px-4">
  <section class="max-w-xl text-center">
    <p class="text-sm font-semibold uppercase tracking-wider text-blue-600">404</p>
    <h1 class="mt-3 text-4xl font-bold text-gray-950">Page not found</h1>
    <p class="mt-4 text-gray-600">
      The page is not available in this local appointment workspace.
    </p>
    <div class="mt-6 flex flex-wrap justify-center gap-3">
      <a routerLink="/" class="rounded-md bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">Home</a>
      <a routerLink="/book-appointment" class="rounded-md border border-gray-300 bg-white px-4 py-2.5 text-sm font-semibold text-gray-800 hover:bg-gray-50">Book appointment</a>
      <button (click)="goBack()" class="rounded-md border border-gray-300 bg-white px-4 py-2.5 text-sm font-semibold text-gray-800 hover:bg-gray-50">Go back</button>
    </div>
  </section>
