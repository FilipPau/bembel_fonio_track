<aside class="flex h-full w-64 flex-col border-r border-sidebar-border bg-sidebar">
  <div class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-sidebar-border bg-sidebar px-6">
    <div class="flex items-center gap-3">
      <div class="brand-mark flex h-9 w-9 items-center justify-center overflow-hidden rounded-lg bg-blue-50 ring-1 ring-blue-100">
        <img src="/images/appointmentmanagerlogo.svg" alt="Appointment Manager logo" class="h-9 w-9 scale-125 object-contain" />
      </div>
      <span class="text-lg font-bold leading-[0.86] tracking-tight text-sidebar-primary">appointment<br>manager</span>
    </div>

    <button (click)="closeMobileMenu()" class="rounded-md p-1 transition-colors hover:bg-gray-100 md:hidden" aria-label="Close menu">
      <svg class="h-5 w-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-6">
    <div class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-muted-foreground">Main</div>

    <a routerLink="/" routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground" [routerLinkActiveOptions]="{ exact: true }" class="admin-nav-link group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-sidebar-foreground transition-all duration-200 hover:bg-sidebar-accent hover:text-sidebar-accent-foreground">
      <svg class="h-5 w-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6" />
      </svg>
      <span>Home</span>
    </a>

    <div class="mb-3 mt-8 px-3 text-xs font-semibold uppercase tracking-wider text-muted-foreground">Workspace</div>

    <a routerLink="/book-appointment" routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground" class="admin-nav-link group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-sidebar-foreground transition-all duration-200 hover:bg-sidebar-accent hover:text-sidebar-accent-foreground">
      <svg class="h-5 w-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3M5 11h14M6 21h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Book Appointment</span>
    </a>

    <a routerLink="/resources" routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground" class="admin-nav-link group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-sidebar-foreground transition-all duration-200 hover:bg-sidebar-accent hover:text-sidebar-accent-foreground">
      <svg class="h-5 w-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0H5m14 0h2M5 21H3m6-10h1m4 0h1M9 7h1m4 0h1" />
      </svg>
      <span>Resources</span>
    </a>

    <a routerLink="/dashboard" routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground" class="admin-nav-link group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-sidebar-foreground transition-all duration-200 hover:bg-sidebar-accent hover:text-sidebar-accent-foreground">
      <svg class="h-5 w-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7 15l3-3 3 2 4-6" />
      </svg>
      <span>Live Operations</span>
    </a>

    <div class="mb-3 mt-8 px-3 text-xs font-semibold uppercase tracking-wider text-muted-foreground">Extras</div>

    <a routerLink="/credits" routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground" class="admin-nav-link group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-sidebar-foreground transition-all duration-200 hover:bg-sidebar-accent hover:text-sidebar-accent-foreground">
      <svg class="h-5 w-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.16c.969 0 1.371 1.24.588 1.81l-3.366 2.445a1 1 0 00-.364 1.118l1.286 3.957c.3.921-.755 1.688-1.539 1.118l-3.366-2.445a1 1 0 00-1.176 0l-3.366 2.445c-.783.57-1.838-.197-1.539-1.118l1.286-3.957a1 1 0 00-.364-1.118L4.061 9.384c-.783-.57-.38-1.81.588-1.81h4.16a1 1 0 00.95-.69l1.29-3.957z" />
      </svg>
      <span>Credits</span>
    </a>
  </nav>
</aside>
