<header class="flex items-center justify-between h-16 px-6 bg-white border-b border-sidebar-border shadow-sm">
  <!-- Left Section: Mobile Menu Toggle & Breadcrumbs -->
  <div class="flex items-center gap-4">
    <!-- Mobile Menu Toggle -->
    <button (click)="toggleMobileMenu()" class="md:hidden p-2 rounded-md hover:bg-gray-100 transition-colors"
      aria-label="Toggle mobile menu">
      <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Breadcrumbs -->
    <nav class="hidden sm:flex items-center space-x-2 text-sm">
      <a routerLink="/" class="text-gray-500 hover:text-gray-700 transition-colors">appointment-manager</a>
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
      <span class="text-gray-900 font-medium">{{ currentPage() }}</span>
    </nav>
  </div>

  <!-- Right Section: Search, Notifications, User Menu -->
  <div class="flex items-center gap-4">

    <!-- User Menu -->
    <div class="relative">
      <button (click)="toggleUserMenu()"
        class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-100 transition-colors user-menu-button" aria-label="User menu">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 shadow-sm shadow-blue-200">
          <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.6 3.4c1.1 0 1.9.6 3.4.6s2.3-.6 3.4-.6c2.2 0 3.8 1.8 3.8 4.2 0 1.7-.8 3.2-1.4 4.5-.7 1.5-.9 3.2-1.2 4.7-.4 2.1-1.2 3.8-2.4 3.8-.9 0-1.1-.9-1.4-2.2-.2-1-.4-2-1-2s-.8 1-1 2c-.3 1.3-.5 2.2-1.4 2.2-1.2 0-2-1.7-2.4-3.8-.3-1.5-.5-3.2-1.2-4.7-.6-1.3-1.4-2.8-1.4-4.5 0-2.4 1.6-4.2 3.8-4.2Z" />
          </svg>
        </div>
        <div class="hidden md:block text-left">
          <p class="text-sm font-medium text-gray-900">{{ user().user.name }}</p>
          <p class="text-xs text-gray-500">{{ user().user.email }}</p>
        </div>
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- User Dropdown -->
      @if (showUserMenu()) {
      <div class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200 z-50 user-menu-dropdown">
        <div class="p-4 border-b border-gray-200">
          <p class="text-sm font-medium text-gray-900">{{ user().user.name }}</p>
          <p class="text-sm text-gray-500">{{ user().user.email }}</p>
        </div>
        <div class="py-2">
          <a href="#"
            class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Profile
          </a>
          <a href="#"
            class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Help & Support
          </a>
        </div>
      </div>
      }
    </div>
  </div>
</header>
